<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>鳥合わせ</title>
  <meta name="theme-color" content="#e5f0e7">
  <meta name="description" content="野鳥の観察記録を入力して、今日見た鳥の一覧を作成するアプリです。">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="鳥合わせ">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=35">
  <link rel="shortcut icon" type="image/png" href="icons/icon-192.png?v=35">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css?v=69">
</head>
<body>

<main id="appContent" class="app-content">
  <header class="app-header">
    <h1>鳥合わせ</h1>
    <div class="app-header__actions">
      <button id="checkedOnlyBtn" class="icon-button" type="button" aria-pressed="false" aria-label="チェック済みだけ表示">
        <svg class="button-icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
          <rect x="4" y="4" width="16" height="16" rx="3"></rect>
          <path d="M8 12.5l2.7 2.7L16.5 8.8"></path>
        </svg>
      </button>
      <button id="clearAllBtn" type="button">一から始める</button>
      <button id="settingsBtn" class="settings-button" type="button" aria-label="設定">
        <svg class="button-icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
          <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"></path>
          <path d="M19.4 15a1.8 1.8 0 0 0 .4 2l.1.1a2.1 2.1 0 1 1-3 3l-.1-.1a1.8 1.8 0 0 0-2-.4 1.8 1.8 0 0 0-1.1 1.7v.2a2.1 2.1 0 1 1-4.2 0v-.2a1.8 1.8 0 0 0-1.1-1.7 1.8 1.8 0 0 0-2 .4l-.1.1a2.1 2.1 0 1 1-3-3l.1-.1a1.8 1.8 0 0 0 .4-2 1.8 1.8 0 0 0-1.7-1.1H2a2.1 2.1 0 1 1 0-4.2h.2a1.8 1.8 0 0 0 1.7-1.1 1.8 1.8 0 0 0-.4-2l-.1-.1a2.1 2.1 0 1 1 3-3l.1.1a1.8 1.8 0 0 0 2 .4 1.8 1.8 0 0 0 1.1-1.7V2a2.1 2.1 0 1 1 4.2 0v.2a1.8 1.8 0 0 0 1.1 1.7 1.8 1.8 0 0 0 2-.4l.1-.1a2.1 2.1 0 1 1 3 3l-.1.1a1.8 1.8 0 0 0-.4 2 1.8 1.8 0 0 0 1.7 1.1h.2a2.1 2.1 0 1 1 0 4.2h-.2a1.8 1.8 0 0 0-1.8 1.2z"></path>
        </svg>
      </button>
    </div>
  </header>

  <div id="meta">
    <div class="meta-row meta-row--datetime">
      <div class="meta-field">
        <label for="obsDate">日付：</label>
        <input type="date" id="obsDate">
      </div>
      <div class="meta-field">
        <label for="obsStartTime">開始時刻：</label>
        <input type="time" id="obsStartTime">
      </div>
      <div class="meta-field">
        <label for="obsEndTime">終了時刻：</label>
        <input type="time" id="obsEndTime">
      </div>
    </div>

    <div>
      <label for="obsPlace">場所：</label>
      <input type="text" id="obsPlace" placeholder="例：東京都○○公園">
    </div>

    <div>
      <label for="obsWeather">天候：</label>
      <input type="text" id="obsWeather" placeholder="例：晴れ・曇">
    </div>

    <div>
      <label for="obsObserver">観察者：</label>
      <input type="text" id="obsObserver" placeholder="氏名">
    </div>
  </div>

  <div id="birdSearch">
    <label for="birdSearchInput">鳥を検索：</label>
    <input type="search" id="birdSearchInput" placeholder="鳥の種名を入れてください">
    <button id="clearBirdSearchBtn" type="button" aria-label="検索語をクリア">クリア</button>
  </div>

  <div id="birdList"></div>
</main>

<section id="outputDrawer" class="output-drawer" aria-label="今日見た鳥">
  <div class="output-drawer__handle">
    <button id="outputDrawerHandle" class="output-drawer__toggle" type="button" aria-expanded="false" aria-controls="outputDrawerContent">
      <span class="output-drawer__bar"></span>
      <span>今日見た鳥は？</span>
    </button>
    <button id="closeOutputDrawerBtn" class="output-drawer__close" type="button" aria-label="今日見た鳥を閉じる">×</button>
  </div>

  <div id="outputDrawerContent" class="output-drawer__content">
    <div class="output-drawer__header">
      <div class="output-drawer__actions">
        <button id="copyBtn" type="button">コピー</button>
      </div>
    </div>
    <pre id="output"></pre>
  </div>
</section>

<script src="bird-data.js?v=66"></script>
<script src="app.js?v=67"></script>

</body>
</html>
